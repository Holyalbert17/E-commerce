services:
  postgres:
    image: postgres:18
    container_name: datamex-ecom-pg
    environment:
      POSTGRES_DB: datamex_ecom
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom_dev_pass
    ports:
      - "5433:5432"
    volumes:
      - ecom_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom -d datamex_ecom"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ecom_pg_data:
